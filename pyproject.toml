[project]
name = "basic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sharddha-Sharddha", email = "sharddharocks001@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.1",
    "langchain-google-genai>=4.4.2",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
    "youtube-transcript-api>=1.2.4",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
basic-rag = "basic_rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
